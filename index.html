<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Romanization Tool</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        h1 {
            font-size: 1.5rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .box {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            resize: vertical;
        }
        #output {
            background-color: #f4f4f4;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Khmer Romanization</h1>
    <div class="container">
        <div class="box">
            <label for="input">Khmer Text</label>
            <textarea id="input" placeholder="វាយបញ្ចូលអក្សរខ្មែរនៅទីនេះ..."></textarea>
        </div>
        <div class="box">
            <label for="output">Romanized Output</label>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@gmana/km-translit@0.0.2/dist/index.umd.min.js"></script>
    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        // The library is loaded globally as `kmTranslit`
        const { khmerToLatin } = kmTranslit;

        input.addEventListener('input', () => {
            const khmerText = input.value;
            if (khmerText.trim() === '') {
                output.value = '';
                return;
            }
            try {
                output.value = khmerToLatin(khmerText);
            } catch (e) {
                output.value = 'Error during romanization.';
                console.error(e);
            }
        });
    </script>
</body>
</html>
